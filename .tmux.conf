unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -s escape-time 0 # Address vim mode switching delay
set -g display-time 2000 # Increase tmux messages display duration from 750ms
set -g status-interval 5 # Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
setw -g automatic-rename off
set -g status-keys emacs 
set -g mouse on
setw -g mode-keys vi
set -g history-limit 5000
set -s set-clipboard external
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keybindings ---
bind p display-popup -E "zsh"
bind f copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# --- Tabs (windows) ---
bind t new-window
bind b previous-window
bind -n M-N next-window
bind -n M-B previous-window
bind -n M-a select-layout main-vertical
bind -n M-A select-layout main-horizontal
# --- Splits ---
bind 5 split-window -h
bind -n M-% split-window -h
bind % split-window -h
bind '"' split-window -v
bind -n M-'"' split-window -v
# --- Session management ---
bind s choose-session
bind S new-session
bind R command-prompt -I "#S" "rename-session '%%'"
bind -n M-M switch-client -n
# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux.conf"
bind = select-layout tiled
# --- Style ---
set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left-length 30
set -g status-left "#[fg=#282c34,bg=#98c379,bold] #S #[fg=#98c379,bg=#282c34]"
set -g window-status-format " #[fg=#5c6370]#I:#W "
set -g window-status-current-format "#[fg=#282c34,bg=#61afef,bold] #I:#W #[fg=#61afef,bg=#282c34]"
set -g window-status-separator ""
set -g status-right-length 250
set -g status-right '#H  %Y-%m-%d %H:%M  #(gitmux "#{pane_current_path}")#[fg=#abb2bf,bg=#282c34]' # brew install gitmux to enable that
# --- Pane Nav, vim integration --- Smart pane switching with awareness of Vim splits.  See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n M-H if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n M-J if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n M-K if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n M-L if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
