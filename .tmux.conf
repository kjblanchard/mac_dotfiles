unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0
# Increase tmux messages display duration from 750ms
set -g display-time 2000
# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5
# Upgrade $TERM
# set -g default-terminal "screen-256color"
#linux foot term
# set -g default-terminal "foot-direct"
# set -ga terminal-overrides ",foot-direct:Tc"
# set -as terminal-overrides ",*:U8=0"
# set -ga terminal-overrides ",*:U8=0"
setw -g automatic-rename off

# Emacs key bindings in tmux command prompt (prefix + :) are better than vi keys, even for vim users
set -g status-keys emacs
# Focus events enabled for terminals that support them
set -g focus-events on
# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# --- Quality of life ---
set -g mouse on
setw -g mode-keys vi
set -g history-limit 5000
#select goes to clipboard
set -s set-clipboard external
#macos uses pbcopy
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# macos copy on selection to system clipboard https://github.com/tmux/tmux/wiki/Clipboard
#set -as terminal-features ',rxvt-unicode-256color:clipboard’

#required by yazi https://yazi-rs.github.io/docs/image-preview/#tmux
set -g allow-passthrough on
# set -ga update-environment TERM
# set -ga update-environment TERM_PROGRAM
#end

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keybindings ---
bind p display-popup -E "zsh"
#cannot use ctrl+shift+p in yazi rn, https://yazi-rs.github.io/docs/image-preview/#tmux
# bind -n M-P display-popup -E "zsh"
bind f copy-mode \;
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# --- Tabs (windows) ---
bind t new-window
bind b previous-window
bind -n M-N next-window
bind -n M-B previous-window

bind -n M-a select-layout main-vertical
bind -n M-A select-layout main-horizontal

# --- Splits ---
bind 5 split-window -h
bind -n M-% split-window -h
bind % split-window -h
bind '"' split-window -v
bind -n M-'"' split-window -v
# --- Pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-H select-pane -L   # Alt+Shift+h
bind -n M-J select-pane -D   # Alt+Shift+j
bind -n M-K select-pane -U   # Alt+Shift+k
bind -n M-L select-pane -R   # Alt+Shift+l
# --- Session management ---
bind s choose-session
bind S new-session
bind R command-prompt -I "#S" "rename-session '%%'"
bind -n M-M switch-client -n
# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux.conf"
bind = select-layout tiled

#tmux/vim
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n M-H if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n M-J if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n M-K if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n M-L if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


